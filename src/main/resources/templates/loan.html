<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Apply Loan</title></head>
<body>
    <h2>Apply for Loan</h2>
    <div style="color:red" th:if="${error}" th:text="${error}"></div>
    <form action="/loan" method="post" th:object="${dto}">
        <label>Customer ID:</label><br>
        <input type="text" th:field="*{customerId}" required><br><br>

        <label>Loan Amount:</label><br>
        <input type="number" th:field="*{amount}" required><br><br>

        <label>Tenure (Months):</label><br>
        <input type="number" th:field="*{tenureMonths}" required><br><br>

        <button type="submit">Apply</button>
    </form>
    <a href="/">Cancel</a>
</body>
</html>
