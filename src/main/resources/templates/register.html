<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style> body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; } input { width: 100%; padding: 8px; margin: 5px 0; } button { width: 100%; padding: 10px; background: green; color: white; border: none; cursor: pointer; } .error { color: red; } </style>
</head>
<body>
    <h2>Register New Customer</h2>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    
    <form action="/register" method="post" th:object="${dto}">
        <label>First Name:</label> <input type="text" th:field="*{firstName}" required>
        <label>Last Name:</label> <input type="text" th:field="*{lastName}" required>
        <label>Email:</label> <input type="email" th:field="*{email}" required>
        <label>Password:</label> <input type="password" th:field="*{password}" required>
        <label>Credit Score:</label> <input type="number" th:field="*{creditScore}" required>
        <label>Yearly Income:</label> <input type="number" step="0.01" th:field="*{yearlyIncome}" required>
        
        <button type="submit">Register</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
