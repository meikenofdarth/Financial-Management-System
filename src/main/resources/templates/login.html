<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style> body { font-family: sans-serif; padding: 20px; text-align: center; } input { padding: 10px; width: 300px; } button { padding: 10px 20px; background: green; color: white; cursor: pointer; } </style>
</head>
<body>
    <h2>Customer Login</h2>
    <div style="color:red" th:if="${error}" th:text="${error}"></div>
    <form action="/login" method="post">
        <input type="text" name="customerId" placeholder="Enter Customer ID (e.g., CUST-XXXX)" required>
        <br><br>
        <button type="submit">Access Dashboard</button>
    </form>
    <br>
    <a href="/">Home</a>
</body>
</html>
