<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Open Account</title></head>
<body>
    <h2>Open New Account</h2>
    <div style="color:red" th:if="${error}" th:text="${error}"></div>
    <form action="/create-account" method="post" th:object="${dto}">
        <label>Customer ID:</label><br>
        <input type="text" th:field="*{customerId}" required><br><br>
        
        <label>Account Type:</label><br>
        <select th:field="*{type}">
            <option value="SAVINGS">Savings</option>
            <option value="CURRENT">Current</option>
        </select><br><br>

        <label>Initial Deposit:</label><br>
        <input type="number" th:field="*{initialDeposit}" step="0.01" required><br><br>

        <button type="submit">Open Account</button>
    </form>
    <a href="/">Cancel</a>
</body>
</html>
