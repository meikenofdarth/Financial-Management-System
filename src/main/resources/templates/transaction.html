<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Transaction</title></head>
<body>
    <h2>Deposit / Withdraw</h2>
    <div style="color:red" th:if="${error}" th:text="${error}"></div>
    <form action="/transaction" method="post" th:object="${dto}">
        <label>Account ID:</label><br>
        <input type="text" th:field="*{accountId}" required><br><br>
        
        <label>Type:</label><br>
        <select th:field="*{type}">
            <option value="DEPOSIT">Deposit</option>
            <option value="WITHDRAW">Withdraw</option>
        </select><br><br>

        <label>Amount:</label><br>
        <input type="number" th:field="*{amount}" step="0.01" required><br><br>

        <button type="submit">Process</button>
    </form>
    <a href="/">Cancel</a>
</body>
</html>
